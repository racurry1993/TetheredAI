name: MLB Full Feature Refresh

on:
  workflow_dispatch:
    inputs:
      fetch_odds:
        description: "Fetch fresh odds?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      days_back:
        description: "Historical days back for games/boxscores/statcast"
        required: true
        default: "730"
      days_forward:
        description: "Upcoming days forward"
        required: true
        default: "14"
      statcast_days_back:
        description: "Statcast days back. Use 14 for testing, 730 for full backfill."
        required: true
        default: "14"
      statcast_chunk_days:
        description: "Statcast chunk size in days"
        required: true
        default: "3"
      statcast_limit_chunks:
        description: "Debug only. Blank for all chunks."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: mlb-feature-refresh-statcast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    # GitHub-hosted runners have a maximum job timeout of 360 minutes.
    # Keep this slightly below the max so failures are explicit and easy to identify.
    timeout-minutes: 350

    env:
      APP_DIR: MLB/mlb_betting_app
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_DB_PATH: data/odds.db
      DATA_DIR: data
      MODEL_DIR: models
      ODDS_SPORT_KEY: baseball_mlb
      ODDS_REGIONS: us
      ODDS_FORMAT: american

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 30
        run: |
          cd "$APP_DIR"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        timeout-minutes: 5
        run: |
          cd "$APP_DIR"
          python scripts/00_init_db.py

      - name: Fetch odds
        if: ${{ inputs.fetch_odds == 'true' }}
        timeout-minutes: 10
        run: |
          cd "$APP_DIR"
          python scripts/01_fetch_odds.py --sport baseball_mlb --regions us --markets h2h

      - name: Fetch MLB games
        timeout-minutes: 30
        run: |
          cd "$APP_DIR"
          python scripts/02_fetch_mlb_games.py \
            --days-back "${{ inputs.days_back }}" \
            --days-forward "${{ inputs.days_forward }}" \
            --game-type R \
            --chunk-days 30

      - name: Fetch MLB boxscores
        timeout-minutes: 180
        run: |
          cd "$APP_DIR"
          python scripts/07_fetch_mlb_boxscores.py \
            --days-back "${{ inputs.days_back }}" \
            --sleep 0.10

      - name: Fetch and aggregate Statcast
        # This is the expensive step. If it times out, rerun with a smaller
        # statcast_days_back or use statcast_limit_chunks to backfill gradually.
        timeout-minutes: 300
        run: |
          cd "$APP_DIR"
          if [ -z "${{ inputs.statcast_limit_chunks }}" ]; then
            python scripts/09_fetch_statcast.py \
              --days-back "${{ inputs.statcast_days_back }}" \
              --chunk-days "${{ inputs.statcast_chunk_days }}" \
              --sleep 0.50
          else
            python scripts/09_fetch_statcast.py \
              --days-back "${{ inputs.statcast_days_back }}" \
              --chunk-days "${{ inputs.statcast_chunk_days }}" \
              --limit-chunks "${{ inputs.statcast_limit_chunks }}" \
              --sleep 0.50
          fi

      - name: Validate Statcast features
        timeout-minutes: 30
        run: |
          cd "$APP_DIR"
          python scripts/10_validate_statcast_features.py

      - name: Build production features
        timeout-minutes: 45
        run: |
          cd "$APP_DIR"
          python scripts/03_build_features.py

      - name: Inspect feature output
        timeout-minutes: 10
        run: |
          cd "$APP_DIR"
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p = Path('data/processed/mlb_game_features.parquet')
          df = pd.read_parquet(p)
          sc = [c for c in df.columns if 'statcast' in c.lower() or '_sc_' in c.lower()]
          print({'rows': len(df), 'cols': len(df.columns), 'statcast_like_cols': len(sc)})
          print(sc[:100])
          PY

      - name: Commit updated data/features
        timeout-minutes: 20
        run: |
          cd "$APP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/odds.db
          git add -f data/processed
          git commit -m "Refresh MLB features with Statcast" || echo "No changes to commit"
          git push
