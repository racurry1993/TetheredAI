name: MLB Full Feature Refresh

on:
  workflow_dispatch:
    inputs:
      fetch_odds:
        description: "Fetch fresh odds?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      days_back:
        description: "Historical days back for games/boxscores"
        required: true
        default: "730"
      days_forward:
        description: "Upcoming days forward"
        required: true
        default: "14"
      refresh_statcast:
        description: "Fetch/aggregate Statcast again? Set false to reuse committed odds.db Statcast tables."
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_existing_statcast:
        description: "When refreshing Statcast, skip date chunks already present in odds.db?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      statcast_days_back:
        description: "Statcast days back. Use 14 for testing, 730 for full backfill."
        required: true
        default: "730"
      statcast_chunk_days:
        description: "Statcast chunk size in days"
        required: true
        default: "3"
      statcast_limit_chunks:
        description: "Debug only. Blank for all chunks."
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: mlb-feature-refresh-statcast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      APP_DIR: MLB/mlb_betting_app
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_DB_PATH: data/odds.db
      DATA_DIR: data
      MODEL_DIR: models
      ODDS_SPORT_KEY: baseball_mlb
      ODDS_REGIONS: us
      ODDS_FORMAT: american

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Set up Python
        uses: actions/setup-python@v5
        timeout-minutes: 10
        with:
          python-version: "3.11"

      - name: Install dependencies
        timeout-minutes: 30
        run: |
          cd "$APP_DIR"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        timeout-minutes: 5
        run: |
          cd "$APP_DIR"
          python scripts/00_init_db.py

      - name: Fetch odds
        if: ${{ inputs.fetch_odds == 'true' }}
        timeout-minutes: 10
        run: |
          cd "$APP_DIR"
          python scripts/01_fetch_odds.py --sport baseball_mlb --regions us --markets h2h

      - name: Fetch MLB games
        timeout-minutes: 30
        run: |
          cd "$APP_DIR"
          python scripts/02_fetch_mlb_games.py \
            --days-back "${{ inputs.days_back }}" \
            --days-forward "${{ inputs.days_forward }}" \
            --game-type R \
            --chunk-days 30

      - name: Fetch MLB boxscores
        timeout-minutes: 180
        run: |
          cd "$APP_DIR"
          python scripts/07_fetch_mlb_boxscores.py \
            --days-back "${{ inputs.days_back }}" \
            --sleep 0.10

      - name: Fetch and aggregate Statcast
        if: ${{ inputs.refresh_statcast == 'true' }}
        timeout-minutes: 300
        run: |
          cd "$APP_DIR"

          SKIP_EXISTING_ARG=""
          if [ "${{ inputs.skip_existing_statcast }}" = "true" ]; then
            SKIP_EXISTING_ARG="--skip-existing"
          fi

          LIMIT_ARG=""
          if [ -n "${{ inputs.statcast_limit_chunks }}" ]; then
            LIMIT_ARG="--limit-chunks ${{ inputs.statcast_limit_chunks }}"
          fi

          python scripts/09_fetch_statcast.py \
            --days-back "${{ inputs.statcast_days_back }}" \
            --chunk-days "${{ inputs.statcast_chunk_days }}" \
            $LIMIT_ARG \
            $SKIP_EXISTING_ARG \
            --sleep 0.50

      - name: Skip Statcast fetch
        if: ${{ inputs.refresh_statcast != 'true' }}
        run: |
          echo "Skipping Statcast fetch/aggregate. Using existing Statcast tables in data/odds.db."

      - name: Inspect Statcast tables after fetch/skip
        timeout-minutes: 5
        run: |
          cd "$APP_DIR"
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = Path('data/odds.db')
          print({'db_exists': db.exists(), 'db_size_mb': round(db.stat().st_size / 1024 / 1024, 2) if db.exists() else None})
          with sqlite3.connect(db) as conn:
              for table in ['mlb_statcast_team_game', 'mlb_statcast_team_hand_game', 'mlb_statcast_pitcher_game']:
                  exists = conn.execute("SELECT name FROM sqlite_master WHERE type='table' AND name=?", (table,)).fetchone() is not None
                  if not exists:
                      print({table: 'missing'})
                      continue
                  row = conn.execute(f"SELECT COUNT(*), MIN(official_date), MAX(official_date), COUNT(DISTINCT official_date) FROM {table}").fetchone()
                  print({table: {'rows': row[0], 'min_date': row[1], 'max_date': row[2], 'distinct_dates': row[3]}})
          PY

      - name: Upload odds.db checkpoint after Statcast step
        uses: actions/upload-artifact@v4
        timeout-minutes: 10
        with:
          name: odds-db-after-statcast-step
          retention-days: 3
          path: ${{ env.APP_DIR }}/data/odds.db

      - name: Commit odds.db checkpoint after Statcast step
        if: ${{ inputs.refresh_statcast == 'true' }}
        timeout-minutes: 20
        run: |
          cd "$APP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/odds.db
          git commit -m "Checkpoint MLB Statcast aggregates" || echo "No Statcast checkpoint changes to commit"
          git push

      - name: Validate Statcast tables
        timeout-minutes: 10
        run: |
          cd "$APP_DIR"
          python scripts/10_validate_statcast_features.py

      - name: Build production features
        timeout-minutes: 60
        run: |
          cd "$APP_DIR"
          python scripts/03_build_features.py

      - name: Inspect feature output
        timeout-minutes: 10
        run: |
          cd "$APP_DIR"
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p = Path('data/processed/mlb_game_features.parquet')
          df = pd.read_parquet(p)
          sc = [c for c in df.columns if 'statcast' in c.lower() or '_sc_' in c.lower()]
          print({'rows': len(df), 'cols': len(df.columns), 'statcast_like_cols': len(sc)})
          print(sc[:100])
          PY

      - name: Commit updated data/features
        timeout-minutes: 20
        run: |
          cd "$APP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/odds.db
          git add -f data/processed
          git commit -m "Refresh MLB features with Statcast" || echo "No feature refresh changes to commit"
          git push
