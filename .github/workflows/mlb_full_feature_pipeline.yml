name: MLB Full Feature Refresh

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: "Historical days back"
        required: true
        default: "730"
      days_forward:
        description: "Upcoming days forward"
        required: true
        default: "14"
      fetch_odds:
        description: "Fetch fresh h2h odds during refresh?"
        required: true
        default: "false"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  actions: read

concurrency:
  group: mlb-full-feature-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      APP_DIR: MLB/mlb_betting_app
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_DB_PATH: data/odds.db
      DATA_DIR: data
      MODEL_DIR: models
      ODDS_SPORT_KEY: baseball_mlb
      ODDS_REGIONS: us
      ODDS_FORMAT: american

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Initialize database
        run: |
          cd "$APP_DIR"
          python scripts/00_init_db.py
      - name: Fetch odds
        if: ${{ inputs.fetch_odds == 'true' }}
        run: |
          cd "$APP_DIR"
          python scripts/01_fetch_odds.py --sport baseball_mlb --regions us --markets h2h
      - name: Fetch MLB games
        run: |
          cd "$APP_DIR"
          python scripts/02_fetch_mlb_games.py \
            --days-back "${{ inputs.days_back }}" \
            --days-forward "${{ inputs.days_forward }}" \
            --game-type R \
            --chunk-days 30
      - name: Fetch MLB boxscores
        run: |
          cd "$APP_DIR"
          python scripts/07_fetch_mlb_boxscores.py \
            --days-back "${{ inputs.days_back }}" \
            --sleep 0.10
      - name: Validate feature engineering
        run: |
          cd "$APP_DIR"
          python scripts/validate_feature_engineering.py
      - name: Build features
        run: |
          cd "$APP_DIR"
          python scripts/03_build_features.py
      - name: Commit refreshed feature outputs
        run: |
          cd "$APP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/odds.db
          git add -f data/processed
          git commit -m "Refresh MLB feature data" || echo "No changes to commit"
          git push
