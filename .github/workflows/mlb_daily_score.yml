name: MLB Daily Score

on:
  workflow_dispatch:
    inputs:
      fetch_odds:
        description: "Fetch fresh odds from The Odds API?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      markets:
        description: "Odds markets to fetch"
        required: true
        default: "h2h"
      days_forward:
        description: "Upcoming days to score"
        required: true
        default: "3"
      recent_boxscore_days:
        description: "Recent boxscore days to refresh"
        required: true
        default: "21"

  schedule:
    - cron: "37 13 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: mlb-daily-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest

    env:
      APP_DIR: MLB/mlb_betting_app
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_DB_PATH: data/odds.db
      DATA_DIR: data
      MODEL_DIR: models
      ODDS_SPORT_KEY: baseball_mlb
      ODDS_REGIONS: us
      ODDS_FORMAT: american

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          cd "$APP_DIR"
          python scripts/00_init_db.py

      - name: Fetch odds
        if: ${{ github.event_name == 'schedule' || inputs.fetch_odds == 'true' }}
        run: |
          cd "$APP_DIR"
          python scripts/01_fetch_odds.py \
            --sport baseball_mlb \
            --regions us \
            --markets "${{ inputs.markets || 'h2h' }}"

      - name: Fetch MLB schedule and results
        run: |
          cd "$APP_DIR"
          python scripts/02_fetch_mlb_games.py \
            --days-back 45 \
            --days-forward "${{ inputs.days_forward || '3' }}" \
            --game-type R \
            --chunk-days 15

      - name: Fetch recent MLB boxscores
        run: |
          cd "$APP_DIR"
          python scripts/07_fetch_mlb_boxscores.py \
            --days-back "${{ inputs.recent_boxscore_days || '21' }}" \
            --sleep 0.10

      - name: Validate feature engineering
        run: |
          cd "$APP_DIR"
          python scripts/validate_feature_engineering.py

      - name: Build features
        run: |
          cd "$APP_DIR"
          python scripts/03_build_features.py

      - name: Score upcoming games with champion model
        run: |
          cd "$APP_DIR"
          python scripts/05_score_today.py \
            --model-path models/mlb_moneyline_champion.joblib \
            --days-forward "${{ inputs.days_forward || '3' }}" \
            --min-edge 0.02 \
            --min-ev 0.00 \
            --min-minutes-before-start 30

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-score-outputs
          retention-days: 2
          path: |
            ${{ env.APP_DIR }}/data/odds.db
            ${{ env.APP_DIR }}/data/processed/**
            ${{ env.APP_DIR }}/data/predictions/**

      - name: Commit updated scoring outputs
        run: |
          cd "$APP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/odds.db
          git add -f data/processed
          git add -f data/predictions
          git commit -m "Update MLB daily scoring outputs" || echo "No changes to commit"
          git push
