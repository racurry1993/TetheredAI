name: MLB Daily Score

on:
  workflow_dispatch:
    inputs:
      fetch_odds:
        description: "Fetch fresh odds?"
        required: true
        default: "true"
        type: choice
        options: ["false", "true"]
      days_forward:
        description: "Upcoming days to score"
        required: true
        default: "3"
      statcast_recent_days:
        description: "Recent Statcast days to update after completed games"
        required: true
        default: "10"

permissions:
  contents: write
  actions: read

concurrency:
  group: mlb-daily-score-statcast
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    env:
      APP_DIR: MLB/mlb_betting_app
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDS_DB_PATH: data/odds.db
      DATA_DIR: data
      MODEL_DIR: models
      ODDS_SPORT_KEY: baseball_mlb
      ODDS_REGIONS: us
      ODDS_FORMAT: american
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd "$APP_DIR"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize database
        run: |
          cd "$APP_DIR"
          python scripts/00_init_db.py

      - name: Fetch odds
        if: ${{ inputs.fetch_odds == 'true' }}
        run: |
          cd "$APP_DIR"
          python scripts/01_fetch_odds.py --sport baseball_mlb --regions us --markets h2h

      - name: Fetch MLB games
        run: |
          cd "$APP_DIR"
          python scripts/02_fetch_mlb_games.py \
            --days-back 14 \
            --days-forward "${{ inputs.days_forward }}" \
            --game-type R \
            --chunk-days 7

      - name: Fetch recent boxscores
        run: |
          cd "$APP_DIR"
          python scripts/07_fetch_mlb_boxscores.py \
            --days-back 14 \
            --sleep 0.10

      - name: Fetch recent Statcast
        run: |
          cd "$APP_DIR"
          python scripts/09_fetch_statcast.py \
            --days-back "${{ inputs.statcast_recent_days }}" \
            --chunk-days 3 \
            --sleep 0.50

      - name: Build features
        run: |
          cd "$APP_DIR"
          python scripts/03_build_features.py

      - name: Score upcoming games
        run: |
          cd "$APP_DIR"
          python scripts/05_score_today.py \
            --model-path models/mlb_moneyline_champion.joblib \
            --days-forward "${{ inputs.days_forward }}" \
            --min-edge 0.02 \
            --min-ev 0.00 \
            --min-minutes-before-start 30

      - name: Commit predictions
        run: |
          cd "$APP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/odds.db
          git add -f data/processed
          git add -f data/predictions
          git commit -m "Update MLB daily scoring with Statcast" || echo "No changes to commit"
          git push
